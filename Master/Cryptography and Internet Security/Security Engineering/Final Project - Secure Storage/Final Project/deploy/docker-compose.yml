services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: secure-file-storage-api:latest
    container_name: secure-file-storage-api
    ports:
      - "8000:8000"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID before running docker compose}
      DATABASE_URL: sqlite:////app/data/filestorage.db
      STORAGE_DIR: /app/data/storage
    volumes:
      - ../data:/app/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
